# docker-compose.yml
services:
  postgres:
    image: postgres:15
    container_name: support_postgres
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: support_backend
    depends_on:
      - postgres
    env_file:
      - ./backend/.env
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    container_name: support_frontend
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:3001
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true

volumes:
  postgres_data:
